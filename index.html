 with the engineering lead on the feasibility.", "fr": "Vérifie la faisabilité avec le tech lead."}, {"en": "We're presenting to the C-suite next Thursday.", "fr": "Nous présentons à la direction générale jeudi prochain."}, {"en": "This is a customer-facing feature : UX matters most.", "fr": "C'est une fonctionnalité visible par le client : l'expérience utilisateur est prioritaire."}, {"en": "The main pain point is that users can't find the settings page.", "fr": "Le principal point de friction, c'est que les utilisateurs ne trouvent pas la page de paramètres."}, {"en": "That's out of scope for this quarter.", "fr": "Ce n'est pas dans le périmètre de ce trimestre."}, {"en": "There's a trade-off between speed and quality here.", "fr": "Il y a un compromis à faire ici entre rapidité et qualité."}, {"en": "Can you give me a rough estimate for this feature?", "fr": "Tu peux me donner une estimation approximative pour cette fonctionnalité ?"}, {"en": "We have dependencies on the data team before we can go live.", "fr": "Nous sommes dépendants de l'équipe data avant de pouvoir lancer."}, {"en": "The velocity dropped this sprint. Let's understand why.", "fr": "La vélocité a baissé ce sprint."}, {"en": "I want to make sure we're aligned on this.", "fr": "Je veux m'assurer qu'on est bien d'accord là-dessus."}, {"en": "Let's loop in the design team.", "fr": "Incluons l'équipe design dans la conversation."}, {"en": "We're running over, let's wrap up.", "fr": "On dépasse, passons à la conclusion Le daily stand-up"}, {"en": "Does the team feel comfortable committing to this?", "fr": "L'équipe se sent à l'aise pour s'engager sur ça ?"}, {"en": "This story is too big. Can we break it down?", "fr": "Cette story est trop grosse, peut-on la découper ?"}, {"en": "What are our dependencies going into this sprint?", "fr": "Quelles sont nos dépendances pour ce sprint ?"}, {"en": "What should we do differently next time?", "fr": "Que devrions-nous faire différemment la prochaine fois ?"}, {"en": "Let's focus on actions, not blame.", "fr": "Concentrons-nous sur les actions, pas sur les responsabilités."}, {"en": "What's one thing we can commit to improving?", "fr": "Quelle est la chose sur laquelle on s'engage à progresser ?"}, {"en": "It needs to ship before anything else.", "fr": "C'est une priorité absolue."}, {"en": "We're going to punt on this for now.", "fr": "On reporte ça pour l'instant (registre informel, très courant)."}, {"en": "Let's stack rank these items.", "fr": "Classons ces éléments par ordre de priorité."}, {"en": "This epic spans three sprints.", "fr": "Cet epic s'étale sur trois sprints."}, {"en": "What's the blast radius?", "fr": "Quelle est l'étendue de l'impact ?"}, {"en": "We need to hotfix this, it can't wait for the next sprint.", "fr": "Il faut un correctif urgent, ça ne peut pas attendre le prochain sprint."}, {"en": "We need to allocate capacity for refactoring.", "fr": "On doit allouer de la capacité pour le refactoring."}, {"en": "If we don't address this now, it'll cost us twice as much later.", "fr": "Si on ne traite pas ça maintenant, ça nous coûtera deux fois plus cher plus tard."}, {"en": "We're committing to the outcome, not the output.", "fr": "On s'engage sur le résultat, pas sur la livrable exacte."}, {"en": "This is a living document ; expect it to evolve.", "fr": "C'est un document vivant ; il va évoluer."}, {"en": "This is subject to change depending on what we learn.", "fr": "C'est susceptible d'évoluer selon ce qu'on apprend."}, {"en": "We're treating this as a working assumption.", "fr": "On considère ça comme une hypothèse de travail."}, {"en": "This is on our radar, but not committed yet.", "fr": "C'est dans notre viseur, mais pas encore engagé."}, {"en": "Help me understand the urgency, what's the business impact if we don't do this now?", "fr": "Aidez-moi à comprendre l'urgence."}, {"en": "What should we deprioritize?", "fr": "Si on intègre ça, quelque chose doit sortir — qu'est-ce qu'on déprioritise function mergeState(local, remote){
  if(!remote||typeof remote!=='object') return local;
  const map={};
  (remote.custom||[]).concat(local.custom||[]).forEach(c=>{ const k=(c&&c.en||'').toLowerCase(); if(k&&!map[k]) map[k]=c; });
  const base=(remote.lastActive||'')>(local.lastActive||'')?remote:local;
  const out=Object.assign({}, base);
  out.custom=Object.values(map);
  out.vocab=Object.assign({}, remote.vocab||{}, local.vocab||{});
  out.cards=Object.assign({}, remote.cards||{}, local.cards||{});
  out.history=Object.assign({}, remote.history||{}, local.history||{});
  out.minutes=Object.assign({}, remote.minutes||{}, local.minutes||{});
  out.oral=Object.assign({}, remote.oral||{}, local.oral||{});
  out.settings=Object.assign({}, remote.settings||{}, local.settings||{});
  out.streak=Math.max(local.streak||0, remote.streak||0);
  out.record=Math.max(local.record||0, remote.record||0);
  out.trad={answered:Math.max((local.trad||{}).answered||0,(remote.trad||{}).answered||0), sum:Math.max((local.trad||{}).sum||0,(remote.trad||{}).sum||0)};
  out.redac={done:Math.max((local.redac||{}).done||0,(remote.redac||{}).done||0)};
  return out;
}

/* ================= VUE : ÉCRIT (traduction + rédaction) ================= */
function chip(w,color,bg){ return `<span class="mono" style="font-size:12px;color:${color};background:${bg};padding:5px 10px;border-radius:999px;display:inline-block;margin:2px 3px">${esc(w)}</span>`; }
function tradBody(){
  const P=DATA.phrases; const idx=UI.tradIdx%P.length; const pair=P[idx]; const dir=UI.tradDir;
  const source = dir==='fr2en'? pair.fr : pair.en;
  const reference = dir==='fr2en'? pair.en : pair.fr;
  const english = dir==='fr2en'? reference : source;
  const srcLabel = dir==='fr2en'? 'TRADUIS EN ANGLAIS' : 'TRADUIS EN FRANÇAIS';
  let correction='';
  if(UI.tradChecked){
    const d=diffWords(reference, UI.tradAnswer);
    const col=d.score>=85?'#189E74':d.score>=60?'#9A6413':'#B4462C';
    correction=`<div style="background:#fff;border-radius:26px;padding:28px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
        <div class="mono" style="font-size:11px;letter-spacing:.12em;color:#6B7192">CORRECTION · TRADUCTION DE RÉFÉRENCE</div>
        <div style="display:flex;align-items:baseline;gap:5px"><span class="serif" style="font-size:30px;color:${col}">${d.score}</span><span class="mono" style="font-size:11px;color:#6B7192">/100 de proximité</span></div>
      </div>
      <div style="font-size:18px;line-height:1.7;margin-bottom:8px">${d.html}</div>
      ${d.missing.length?`<div style="margin-top:12px;font-size:13px;color:#6B7192">Mots de la référence que tu n'as pas repris : ${d.missing.slice(0,14).map(w=>chip(w,'#B4462C','#FBE5DF')).join('')}</div>`:''}
      ${d.extra.length?`<div style="margin-top:8px;font-size:13px;color:#6B7192">Tes mots hors référence (à vérifier ou synonymes) : ${d.extra.slice(0,14).map(w=>chip(w,'#5C6280','#EDEDF6')).join('')}</div>`:''}
      <div style="margin-top:16px;padding-top:14px;border-top:1px solid #F1F1F8;font-size:14px;color:#5C6280;line-height:1.6">Ta réponse : « ${esc(UI.tradAnswer)||'(vide)'} »<br>${d.score>=85?'Excellent, très proche de la référence.':d.score>=60?'Bien. Compare les mots soulignés et réessaie.':'À retravailler : reprends les mots surlignés en rouge.'} <span style="color:#9A7B63">La note mesure la proximité avec une traduction possible, pas la seule bonne réponse.</span></div>
    </div>`;
  }

/* ================= MICRO / RECONNAISSANCE VOCALE ================= */
let mediaRec=null, mediaChunks=[], sr=null;
function normalize(s){ return s.toLowerCase().replace(/[^a-z0-9' ]/g,' ').split(/\s+/).filter(Boolean); }
/* diff mot à mot entre une réponse et une référence */
function tok(t){ return t.toLowerCase().replace(/[^a-z0-9']/g,''); } // hyphens/punctuation retirés
function diffWords(reference, answer){
  const refTokens=reference.split(/\s+/).filter(Boolean);
  const ansBag={}; answer.split(/\s+/).forEach(t=>{ const w=tok(t); if(w) ansBag[w]=(ansBag[w]||0)+1; });
  let matched=0, refCount=0; const missing=[];
  const html=refTokens.map(t=>{
    const w=tok(t);
    if(!w) return `<span style="color:#5C6280">${esc(t)}</span>`;        // ponctuation
    refCount++;
    if(ansBag[w]>0){ ansBag[w]--; matched++; return `<span style="color:#0F6E50">${esc(t)}</span>`; }
    missing.push(w);
    return `<span style="color:#B4462C;text-decoration:underline;text-decoration-style:wavy">${esc(t)}</span>`;
  }).join(' ');
  const extra=Object.keys(ansBag).filter(w=>ansBag[w]>0);
  const score=refCount?Math.round(matched/refCount*100):0;
  return {html, score, missing, extra};
}
function scoreMatch(target,said){
  const a=normalize(target), b=normalize(said); if(!a.length) return 0;
  const bag={}; b.forEach(w=>bag[w]=(bag[w]||0)+1); let hit=0;
  a.forEach(w=>{ if(bag[w]>0){ hit++; bag[w]--; } });
  return Math.round(hit/a.length*100);
}
function startRecognition(target,idx){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(SR){
    sr=new SR(); sr.lang=S.settings.accent||'en-GB'; sr.interimResults=false; sr.maxAlternatives=1;
    UI.rec={state:'recording',transcript:'',score:null,url:UI.rec.url};
    render();
    sr.onresult=(e)=>{ const said=e.results[0][0].transcript; const sc=scoreMatch(target,said);
      UI.rec={state:'done',transcript:said,score:sc,url:UI.rec.url};
      S.oral[idx]=Math.max(S.oral[idx]||0,sc); S.program.oral=true; recordActivity(); render();
    };
    sr.onerror=(e)=>{ UI.rec={state:'idle',transcript:'',score:null,url:UI.rec.url}; toast(e.error==='not-allowed'?'Micro refusé':'Reconnaissance interrompue'); render(); };
    sr.onend=()=>{ if(UI.rec.state==='recording'){ UI.rec.state='idle'; render(); } };
    try{ sr.start(); }catch(e){ recordFallback(target,idx); }
  } else {
    recordFallback(target,idx);
  }
}
function recordFallback(target,idx){
  // pas de reconnaissance vocale -> on enregistre l'audio pour réécoute
  navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
    mediaRec=new MediaRecorder(stream); mediaChunks=[];
    mediaRec.ondataavailable=e=>mediaChunks.push(e.data);
    mediaRec.onstop=()=>{ const blob=new Blob(mediaChunks,{type:'audio/webm'}); const url=URL.createObjectURL(blob);
      UI.rec={state:'done',transcript:'',score:null,url:url}; S.program.oral=true; recordActivity();
      stream.getTracks().forEach(t=>t.stop()); render(); toast('Enregistré — réécoute-toi et compare'); };
    UI.rec={state:'recording',transcript:'',score:null,url:null}; render();
    mediaRec.start();
    setTimeout(()=>{ if(mediaRec&&mediaRec.state==='recording') mediaRec.stop(); },5000);
  }).catch(()=>{ toast('Micro indisponible ou refusé'); UI.rec={state:'idle',transcript:'',score:null,url:null}; render(); });
}
function stopRec(){ if(sr){ try{sr.stop();}catch(e){} } if(mediaRec&&mediaRec.state==='recording'){ mediaRec.stop(); } }

function exportCSV(){

  allTerms().forEach(t=>{ const k=t.en.toLowerCase(); const v=S.vocab[k]||{}; const c=S.cards[k]||{};
    rows.push([t.custom?'perso':'vocab',t.en,t.fr,v.mastered?'oui':'non',c.box??'',c.seen??'',c.fails??'']); });
  rows.push(['quiz','present perfect vs past simple','', S.quiz.correct+'/'+S.quiz.answered,'','','']);
  const csv=rows.map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='fluentpo-progression.csv'; a.click();
  toast('Export CSV téléchargé');
}
