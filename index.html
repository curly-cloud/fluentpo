</style>
</head>
<body>
<div id="app"></div>

<template id="tpl">
<div style="font-family:'DM Sans',Helvetica,sans-serif;color:#1B2138;background:#FADFC4;padding:30px 30px 46px;min-height:100vh;box-sizing:border-box">
<div style="max-width:1280px;margin:0 auto;background:#F7F7FC;border-radius:30px;box-shadow:0 30px 60px -40px rgba(27,33,56,.35);overflow:hidden">

  <!-- NAV -->
  <div style="display:flex;align-items:center;gap:26px;padding:22px 34px;border-bottom:1px solid #ECECF5;flex-wrap:wrap">
    <div style="display:flex;align-items:center;gap:11px">
      <div style="width:34px;height:34px;border-radius:999px;background:#5B3BD4;color:#fff;display:flex;align-items:center;justify-content:center;font-family:'DM Serif Display',Georgia,serif;font-size:18px">f</div>
      <div style="font-size:19px;font-weight:700;letter-spacing:-.01em">FluentPO</div>
    </div>
    <div style="flex:1;min-width:20px"></div>
    <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
      <div onClick="{{ goDash }}" style="padding:9px 14px;border-radius:999px;font-size:14px;font-weight:700;cursor:pointer;background:{{ navDashBg }};color:{{ navDashFg }}" style-hover="background:#EFEFF8">Suivi</div>
      <div onClick="{{ goLesson }}" style="padding:9px 14px;border-radius:999px;font-size:14px;font-weight:700;cursor:pointer;background:{{ navLessonBg }};color:{{ navLessonFg }}" style-hover="background:#EFEFF8">Leçon</div>
      <div onClick="{{ goGram }}" style="padding:9px 14px;border-radius:999px;font-size:14px;font-weight:700;cursor:pointer;background:{{ navGramBg }};color:{{ navGramFg }}" style-hover="background:#EFEFF8">Grammaire</div>
      <div onClick="{{ goVocab }}" style="padding:9px 14px;border-radius:999px;font-size:14px;font-weight:700;cursor:pointer;background:{{ navVocabBg }};color:{{ navVocabFg }}" style-hover="background:#EFEFF8">Vocabulaire</div>
      <div onClick="{{ goCards }}" style="padding:9px 14px;border-radius:999px;font-size:14px;font-weight:700;cursor:pointer;background:{{ navCardsBg }};color:{{ navCardsFg }}" style-hover="background:#EFEFF8">Cartes</div>
      <div onClick="{{ goOral }}" style="padding:9px 14px;border-radius:999px;font-size:14px;font-weight:700;cursor:pointer;background:{{ navOralBg }};color:{{ navOralFg }}" style-hover="background:#EFEFF8">Oral</div>
      <div onClick="{{ goSettings }}" style="padding:9px 14px;border-radius:999px;font-size:14px;font-weight:700;cursor:pointer;background:{{ navSetBg }};color:{{ navSetFg }}" style-hover="background:#EFEFF8">Réglages</div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;padding:8px 8px 8px 16px;border:1px solid #DCDCEB;border-radius:999px;background:#fff">
      <span style="font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.08em;color:#6B7192">SÉRIE 14 J</span>
      <div style="width:30px;height:30px;border-radius:999px;overflow:hidden;background:#E9E4FB"><img src="assets/portrait-2.jpg" alt="" style="width:100%;height:100%;object-fit:cover;object-position:50% 25%;display:block"></div>
    </div>
  </div>

  <!-- SUIVI -->
  <sc-if value="{{ isDash }}" hint-placeholder-val="{{ true }}">
    <div>
      <!-- HERO ÉDITORIAL -->
      <div style="padding:52px 34px 44px;display:flex;align-items:center;justify-content:center;gap:34px">
        <div style="flex:0 1 150px;min-width:0;display:flex;flex-direction:column;gap:26px;align-items:center">
          <div style="width:100%;max-width:132px;aspect-ratio:3/4;border-radius:78px 78px 12px 12px;overflow:hidden;background:#E9E4FB"><img src="assets/portrait-1.jpg" alt="" style="width:100%;height:100%;object-fit:cover;object-position:50% 30%;display:block"></div>
          <div style="width:10px;height:10px;border-radius:999px;background:#5B3BD4;align-self:flex-end"></div>
          <div style="width:100%;max-width:118px;aspect-ratio:9/10;border-radius:14px;overflow:hidden;background:#FBDCC9"><img src="assets/portrait-2.jpg" alt="" style="width:100%;height:100%;object-fit:cover;object-position:50% 28%;display:block"></div>
        </div>

        <div style="flex:1 1 560px;max-width:620px;text-align:center">
          <div style="font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.14em;color:#6B7192;margin-bottom:18px">MARDI 16 SEPT. · 25 MIN PRÉVUES</div>
          <h1 style="font-family:'DM Serif Display',Georgia,serif;font-size:62px;line-height:1.04;margin:0 0 8px;font-weight:400;letter-spacing:-.015em">Passe au niveau</h1>
          <div style="display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;margin-bottom:6px">
            <div style="background:#1B2138;color:#F7F7FC;padding:6px 20px;border-radius:12px;font-family:'DM Serif Display',Georgia,serif;font-size:48px;line-height:1.1">B2</div>
            <div style="font-family:'DM Serif Display',Georgia,serif;font-style:italic;font-size:56px;line-height:1.05">solide</div>
            <div onClick="{{ goLesson }}" style="padding:15px 28px;border:1px solid #1B2138;border-radius:999px;font-size:15px;font-weight:700;cursor:pointer;background:#fff" style-hover="background:#1B2138;color:#F7F7FC">Commencer →</div>
          </div>
          <div style="font-family:'DM Serif Display',Georgia,serif;font-size:44px;line-height:1.1;margin-bottom:16px">en <span style="font-style:italic">un mois</span>, C1 en deux</div>
          <p style="margin:0 auto;max-width:440px;font-size:15px;line-height:1.6;color:#5C6280;text-wrap:pretty">Anglais général et vocabulaire Product Owner, 25 minutes par jour. Jalon B2 solide au 16 octobre, C1 solide au 16 novembre.</p>
        </div>

        <div style="flex:0 1 150px;min-width:0;display:flex;flex-direction:column;gap:26px;align-items:center">
          <div style="width:100%;max-width:124px;aspect-ratio:9/10;border-radius:70px 70px 70px 16px;overflow:hidden;background:#D8E7FA"><img src="assets/portrait-2.jpg" alt="" style="width:100%;height:100%;object-fit:cover;object-position:50% 25%;display:block"></div>
          <div style="width:9px;height:9px;border-radius:999px;background:#E4573D;align-self:flex-start"></div>
          <div style="width:100%;max-width:130px;aspect-ratio:1;border-radius:999px;overflow:hidden;background:#D6F0E4"><img src="assets/portrait-1.jpg" alt="" style="width:100%;height:100%;object-fit:cover;object-position:50% 35%;display:block"></div>
        </div>
      </div>

      <!-- PROGRESSION -->
      <div style="padding:8px 34px 0;display:flex;gap:20px;flex-wrap:wrap">
        <div style="flex:1 1 420px;min-width:0;background:#1B2138;border-radius:26px;padding:28px;color:#F7F7FC">
          <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px">
            <div style="font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.12em;color:#A9B0CF">JALON 1 · B2 SOLIDE</div>
            <div style="font-family:'DM Mono',monospace;font-size:11px;color:#A9B0CF">16 OCT. · J-12</div>
          </div>
          <div style="display:flex;align-items:flex-end;gap:16px;margin-bottom:18px;flex-wrap:wrap">
            <div style="font-family:'DM Serif Display',Georgia,serif;font-size:56px;line-height:.85">B2</div>
            <div style="font-size:14px;color:#A9B0CF;padding-bottom:10px">grammaire + oral d'entretien</div>
            <div style="margin-left:auto;font-size:34px;font-weight:700;color:#4ED8A0">{{ b2Label }}</div>
          </div>
          <div style="height:12px;border-radius:999px;background:#2E3556;overflow:hidden;margin-bottom:10px"><div style="height:100%;border-radius:999px;background:linear-gradient(90deg,#189E74,#4ED8A0);width:{{ b2Pct }}"></div></div>
          <div style="display:flex;justify-content:space-between;font-family:'DM Mono',monospace;font-size:10.5px;color:#7B82A6;margin-bottom:22px"><span>B1+</span><span>B2 SOLIDE</span></div>
          <div style="display:flex;align-items:center;gap:14px;padding-top:18px;border-top:1px solid #313858;flex-wrap:wrap">
            <div style="font-size:14px;color:#A9B0CF">Jalon 2 · <strong style="color:#F7F7FC">C1 solide</strong> — 16 nov.</div>
            <div style="flex:1;min-width:90px;height:7px;border-radius:999px;background:#2E3556"><div style="height:100%;width:24%;border-radius:999px;background:#8FBBF0"></div></div>
            <div style="font-family:'DM Mono',monospace;font-size:12px;color:#8FBBF0">24%</div>
          </div>
        </div>

        <div style="flex:1 1 320px;min-width:0;background:#fff;border-radius:26px;padding:28px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px">
            <div><div style="font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.12em;color:#6B7192;margin-bottom:4px">RÉGULARITÉ · 12 SEMAINES</div><div style="display:flex;align-items:baseline;gap:8px"><span style="font-family:'DM Serif Display',Georgia,serif;font-size:32px">14</span><span style="font-size:13px;color:#5C6280">jours d'affilée</span></div></div>
            <div style="font-family:'DM Mono',monospace;font-size:11px;color:#0F6E50;background:#E4F5EE;padding:7px 11px;border-radius:999px">RECORD 18</div>
          </div>
          <div style="display:grid;grid-template-columns:repeat(12,1fr);gap:5px">
            <div style="aspect-ratio:1;border-radius:4px;background:#EDEDF6"></div><div style="aspect-ratio:1;border-radius:4px;background:#C6EADB"></div><div style="aspect-ratio:1;border-radius:4px;background:#8AD3B8"></div><div style="aspect-ratio:1;border-radius:4px;background:#EDEDF6"></div><div style="aspect-ratio:1;border-radius:4px;background:#8AD3B8"></div><div style="aspect-ratio:1;border-radius:4px;background:#189E74"></div><div style="aspect-ratio:1;border-radius:4px;background:#C6EADB"></div><div style="aspect-ratio:1;border-radius:4px;background:#8AD3B8"></div><div style="aspect-ratio:1;border-radius:4px;background:#189E74"></div><div style="aspect-ratio:1;border-radius:4px;background:#189E74"></div><div style="aspect-ratio:1;border-radius:4px;background:#C6EADB"></div><div style="aspect-ratio:1;border-radius:4px;background:#8AD3B8"></div>
            <div style="aspect-ratio:1;border-radius:4px;background:#C6EADB"></div><div style="aspect-ratio:1;border-radius:4px;background:#189E74"></div><div style="aspect-ratio:1;border-radius:4px;background:#189E74"></div><div style="aspect-ratio:1;border-radius:4px;background:#8AD3B8"></div><div style="aspect-ratio:1;border-radius:4px;background:#189E74"></div><div style="aspect-ratio:1;border-radius:4px;background:#EDEDF6"></div><div style="aspect-ratio:1;border-radius:4px;background:#C6EADB"></div><div style="aspect-ratio:1;border-radius:4px;background:#189E74"></div><div style="aspect-ratio:1;border-radius:4px;background:#189E74"></div><div style="aspect-ratio:1;border-radius:4px;background:#8AD3B8"></div><div style="aspect-ratio:1;border-radius:4px;background:#189E74"></div><div style="aspect-ratio:1;border-radius:4px;background:#189E74"></div>
            <div style="aspect-ratio:1;border-radius:4px;background:#8AD3B8"></div><div style="aspect-ratio:1;border-radius:4px;background:#EDEDF6"></div><div style="aspect-ratio:1;border-radius:4px;background:#C6EADB"></div><div style="aspect-ratio:1;border-radius:4px;background:#189E74"></div><div style="aspect-ratio:1;border-radius:4px;background:#189E74"></div><div style="aspect-ratio:1;border-radius:4px;background:#189E74"></div><div style="aspect-ratio:1;border-radius:4px;background:#8AD3B8"></div><div style="aspect-ratio:1;border-radius:4px;background:#189E74"></div><div style="aspect-ratio:1;border-radius:4px;background:#C6EADB"></div><div style="aspect-ratio:1;border-radius:4px;background:#189E74"></div><div style="aspect-ratio:1;border-radius:4px;background:#189E74"></div><div style="aspect-ratio:1;border-radius:4px;background:#8AD3B8"></div>
            <div style="aspect-ratio:1;border-radius:4px;background:#189E74"></div><div style="aspect-ratio:1;border-radius:4px;background:#189E74"></div><div style="aspect-ratio:1;border-radius:4px;background:#8AD3B8"></div><div style="aspect-ratio:1;border-radius:4px;background:#189E74"></div><div style="aspect-ratio:1;border-radius:4px;background:#189E74"></div><div style="aspect-ratio:1;border-radius:4px;background:#C6EADB"></div><div style="aspect-ratio:1;border-radius:4px;background:#189E74"></div><div style="aspect-ratio:1;border-radius:4px;background:#189E74"></div><div style="aspect-ratio:1;border-radius:4px;background:#189E74"></div><div style="aspect-ratio:1;border-radius:4px;background:#8AD3B8"></div><div style="aspect-ratio:1;border-radius:4px;background:#189E74"></div><div style="aspect-ratio:1;border-radius:4px;background:#0F6E50;outline:2px solid #0F6E50;outline-offset:2px"></div>
          </div>
          <div style="display:flex;justify-content:space-between;font-family:'DM Mono',monospace;font-size:10px;color:#5C6280;margin-top:10px"><span>JUIL.</span><span>AUJOURD'HUI</span></div>
          <div style="display:flex;gap:20px;margin-top:18px;padding-top:18px;border-top:1px solid #EDEDF6">
            <div><div style="font-family:'DM Serif Display',Georgia,serif;font-size:24px">92%</div><div style="font-size:12.5px;color:#6B7192">assiduité 30 j</div></div>
            <div><div style="font-family:'DM Serif Display',Georgia,serif;font-size:24px">6 h 10</div><div style="font-size:12.5px;color:#6B7192">ce mois-ci</div></div>
            <div><div style="font-family:'DM Serif Display',Georgia,serif;font-size:24px">218</div><div style="font-size:12.5px;color:#6B7192">expressions vues</div></div>
          </div>
        </div>
      </div>

      <!-- PROGRAMME + RÉVISIONS -->
      <div style="padding:20px 34px 0;display:flex;gap:20px;flex-wrap:wrap">
        <div style="flex:1 1 420px;min-width:0">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
            <div style="font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.12em;color:#6B7192">PROGRAMME D'AUJOURD'HUI</div>
            <div style="font-family:'DM Mono',monospace;font-size:11px;color:#0F6E50">2 / 4 FAIT</div>
          </div>
          <div style="display:flex;flex-direction:column;gap:10px">
            <div onClick="{{ goLesson }}" style="display:flex;align-items:center;gap:16px;background:#fff;border-radius:18px;padding:18px;cursor:pointer" style-hover="box-shadow:0 10px 24px -18px rgba(27,33,56,.5)">
              <div style="width:38px;height:38px;border-radius:999px;background:#E9E4FB;color:#5B3BD4;display:flex;align-items:center;justify-content:center;font-family:'DM Mono',monospace;font-size:12px">01</div>
              <div style="flex:1;min-width:0"><div style="font-weight:700;font-size:15.5px">Leçon · Stakeholder management</div><div style="font-size:13px;color:#6B7192">Texte, audio et vidéo — 8 min</div></div>
              <div style="font-family:'DM Mono',monospace;font-size:10px;color:#B4462C;background:#FBE5DF;padding:6px 10px;border-radius:999px">À FAIRE</div>
            </div>
            <div onClick="{{ goGram }}" style="display:flex;align-items:center;gap:16px;background:#fff;border-radius:18px;padding:18px;cursor:pointer" style-hover="box-shadow:0 10px 24px -18px rgba(27,33,56,.5)">
              <div style="width:38px;height:38px;border-radius:999px;background:#E4F5EE;color:#0F6E50;display:flex;align-items:center;justify-content:center;font-family:'DM Mono',monospace;font-size:12px">02</div>
              <div style="flex:1;min-width:0"><div style="font-weight:700;font-size:15.5px">Grammaire · Present perfect vs past simple</div><div style="font-size:13px;color:#6B7192">Règle + 5 questions — 5 min</div></div>
              <div style="font-family:'DM Mono',monospace;font-size:10px;color:#0F6E50;background:#E4F5EE;padding:6px 10px;border-radius:999px">FAIT</div>
            </div>
            <div onClick="{{ goVocab }}" style="display:flex;align-items:center;gap:16px;background:#fff;border-radius:18px;padding:18px;cursor:pointer" style-hover="box-shadow:0 10px 24px -18px rgba(27,33,56,.5)">
              <div style="width:38px;height:38px;border-radius:999px;background:#E4F5EE;color:#0F6E50;display:flex;align-items:center;justify-content:center;font-family:'DM Mono',monospace;font-size:12px">03</div>
              <div style="flex:1;min-width:0"><div style="font-weight:700;font-size:15.5px">Vocabulaire PO · Delivery &amp; priorisation</div><div style="font-size:13px;color:#6B7192">3 termes en contexte produit — 4 min</div></div>
              <div style="font-family:'DM Mono',monospace;font-size:10px;color:#0F6E50;background:#E4F5EE;padding:6px 10px;border-radius:999px">FAIT</div>
            </div>
            <div onClick="{{ goOral }}" style="display:flex;align-items:center;gap:16px;background:#fff;border-radius:18px;padding:18px;cursor:pointer" style-hover="box-shadow:0 10px 24px -18px rgba(27,33,56,.5)">
              <div style="width:38px;height:38px;border-radius:999px;background:#FDF0DC;color:#9A6413;display:flex;align-items:center;justify-content:center;font-family:'DM Mono',monospace;font-size:12px">04</div>
              <div style="flex:1;min-width:0"><div style="font-weight:700;font-size:15.5px">Pratique orale · Sprint review</div><div style="font-size:13px;color:#6B7192">8 phrases à répéter — 8 min</div></div>
              <div style="font-family:'DM Mono',monospace;font-size:10px;color:#B4462C;background:#FBE5DF;padding:6px 10px;border-radius:999px">À FAIRE</div>
            </div>
          </div>
        </div>
        <div style="flex:1 1 300px;min-width:0">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
            <div style="font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.12em;color:#6B7192">À RÉVISER · REPORTÉ</div>
            <div onClick="{{ goCards }}" style="font-size:13px;font-weight:700;color:#5B3BD4;cursor:pointer">Tout réviser →</div>
          </div>
          <div style="background:#fff;border-radius:22px;overflow:hidden">
            <div style="display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid #F1F1F8"><div style="flex:1;min-width:0"><div style="font-size:15px;font-weight:700">to push back</div><div style="font-size:12.5px;color:#6B7192">échoué 2 fois</div></div><div style="font-family:'DM Mono',monospace;font-size:10.5px;color:#B4462C">J-2</div></div>
            <div style="display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid #F1F1F8"><div style="flex:1;min-width:0"><div style="font-size:15px;font-weight:700">trade-off</div><div style="font-size:12.5px;color:#6B7192">échoué 1 fois</div></div><div style="font-family:'DM Mono',monospace;font-size:10.5px;color:#B4462C">J-3</div></div>
            <div style="display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid #F1F1F8"><div style="flex:1;min-width:0"><div style="font-size:15px;font-weight:700">used to + V</div><div style="font-size:12.5px;color:#6B7192">grammaire</div></div><div style="font-family:'DM Mono',monospace;font-size:10.5px;color:#B4462C">J-1</div></div>
            <div style="padding:16px 18px;font-size:13px;color:#6B7192">+ 6 autres notions en attente</div>
          </div>
        </div>
      </div>

      <!-- TROIS PILIERS -->
      <div style="margin-top:36px;padding:34px;border-top:1px solid #ECECF5;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:30px;text-align:center">
        <div><div style="font-family:'DM Serif Display',Georgia,serif;font-size:26px;margin-bottom:8px">B2 solide en 1 mois</div><div style="font-size:14px;line-height:1.6;color:#5C6280">Grammaire ciblée, lecture et écoute quotidiennes, jalon évalué le 16 octobre.</div></div>
        <div><div style="font-family:'DM Serif Display',Georgia,serif;font-size:26px;margin-bottom:8px">C1 solide en 2 mois</div><div style="font-size:14px;line-height:1.6;color:#5C6280">Nuances, oral d'entretien et argumentation produit, jalon le 16 novembre.</div></div>
        <div><div style="font-family:'DM Serif Display',Georgia,serif;font-size:26px;margin-bottom:8px">Pensé pour un PO</div><div style="font-size:14px;line-height:1.6;color:#5C6280"><a href="#vocab">Vocabulaire agilité, delivery et stakeholders</a> en contexte produit réel.</div></div>
      </div>
    </div>
  </sc-if>

  <!-- LEÇON -->
  <sc-if value="{{ isLesson }}" hint-placeholder-val="{{ false }}">
    <div style="padding:34px">
      <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:22px;flex-wrap:wrap;margin-bottom:24px">
        <div>
          <div style="font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.14em;color:#5B3BD4;margin-bottom:10px">LEÇON 14 / 30 · NIVEAU B2</div>
          <h1 style="font-family:'DM Serif Display',Georgia,serif;font-size:44px;line-height:1.05;margin:0 0 8px;font-weight:400">Stakeholder <span style="font-style:italic">management</span></h1>
          <div style="font-size:15px;color:#5C6280">Aligner des parties prenantes aux priorités divergentes</div>

      recIcon: rec === "recording" ? "■" : "●",
      recAnim: rec === "recording" ? "pulseRec 1.6s infinite" : "none",
      recLabel: rec === "recording" ? "Enregistrement…" : rec === "done" ? "Enregistré · réécoute ci-contre" : "Clique et répète la phrase",
      recSub: rec === "recording" ? "0:03 · PARLE NORMALEMENT" : "MICRO · 5 S MAX"
    };
  }

  /* ---- binding engine ---- */

  function resolveExpr(expr, scope) {
    expr = expr.trim();
    if (expr === "true") return true;
    if (expr === "false") return false;
    if (expr.indexOf(".") !== -1) {
      var parts = expr.split(".");
      var o = scope[parts[0]];
      for (var i = 1; i < parts.length && o != null; i++) o = o[parts[i]];
      return o;
    }
    return scope[expr];
  }

  // Single-binding attribute like value="{{ isDash }}" or onClick="{{ goDash }}".
  function resolveBinding(attrVal, scope) {
    var m = /^\s*\{\{([^}]+)\}\}\s*$/.exec(attrVal);
    if (!m) return interp(attrVal, scope);
    return resolveExpr(m[1], scope);
  }

  // String interpolation for text and style attributes.
  function interp(str, scope) {
    return str.replace(/\{\{([^}]+)\}\}/g, function (_, e) {
      var val = resolveExpr(e, scope);
      return val == null ? "" : String(val);
    });
  }

  function renderNode(node, scope, sink) {
    // text
    if (node.nodeType === 3) return document.createTextNode(interp(node.nodeValue, scope));
    // comment -> drop
    if (node.nodeType === 8) return document.createComment("");
    if (node.nodeType !== 1) return document.createTextNode("");

    var tag = node.tagName.toLowerCase();

    if (tag === "sc-if") {
      var frag = document.createDocumentFragment();
      if (resolveBinding(node.getAttribute("value") || "", scope)) {
        appendChildren(node, scope, frag, sink);
      }
      return frag;
    }

    if (tag === "sc-for") {
      var listFrag = document.createDocumentFragment();
      var list = resolveBinding(node.getAttribute("list") || "", scope) || [];
      var as = node.getAttribute("as") || "item";
      list.forEach(function (item) {
        var childScope = Object.assign({}, scope);
        childScope[as] = item;
        appendChildren(node, childScope, listFrag, sink);
      });
      return listFrag;
    }

    var el = document.createElement(tag);
    var hoverRaw = null;
    for (var i = 0; i < node.attributes.length; i++) {
      var a = node.attributes[i];
      var name = a.name, value = a.value;
      if (name === "onclick") {
        var fn = resolveBinding(value, scope);
        if (typeof fn === "function") sink.handlers.push({ el: el, fn: fn });
      } else if (name === "style-hover") {
        hoverRaw = value;
      } else if (name === "hint-placeholder-val" || name === "hint-placeholder-count") {
        // editor-only hint; ignore
      } else {
        el.setAttribute(name, interp(value, scope));
      }
    }
    appendChildren(node, scope, el, sink);
    if (hoverRaw != null) {
      sink.hovers.push({ el: el, base: el.getAttribute("style") || "", hover: interp(hoverRaw, scope) });
    }
    return el;
  }

  function appendChildren(node, scope, target, sink) {
    for (var i = 0; i < node.childNodes.length; i++) {
      target.appendChild(renderNode(node.childNodes[i], scope, sink));
    }
  }

  var app = document.getElementById("app");
  var tpl = document.getElementById("tpl");

  function render() {
    var vals = computeVals();
    var sink = { handlers: [], hovers: [] };
    var frag = document.createDocumentFragment();
    for (var i = 0; i < tpl.content.childNodes.length; i++) {
      frag.appendChild(renderNode(tpl.content.childNodes[i], vals, sink));
    }
    app.replaceChildren(frag);
    sink.handlers.forEach(function (h) { h.el.addEventListener("click", h.fn); });
    sink.hovers.forEach(function (h) {
      h.el.addEventListener("mouseenter", function () { h.el.setAttribute("style", h.base + ";" + h.hover); });
      h.el.addEventListener("mouseleave", function () { h.el.setAttribute("style", h.base); });
    });
  }

  render();
})();

</script>
</body>
</html>
