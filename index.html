/* ---- Sync helpers ---- */
function cloudOn(){ return !!SB; }
function scheduleCloudPush(){ if(!SB||!SESSION) return; clearTimeout(syncTimer); syncTimer=setTimeout(cloudPush,1500); }
async function cloudPush(){ if(!SB||!SESSION) return; try{ await SB.auth.updateUser({ data:{ fluentpo:S } }); }catch(e){} }
async function cloudPull(){ if(!SB||!SESSION) return null; try{ const { data:{ user } }=await SB.auth.getUser(); return user&&user.user_metadata?user.user_metadata.fluentpo:null; }catch(e){ return null; } }
function mergeState(local, remote){
  if(!remote||typeof remote!=='object') return local;
  const map={};
  (remote.custom||[]).concat(local.custom||[]).forEach(c=>{ const k=(c&&c.en||'').toLowerCase(); if(k&&!map[k]) map[k]=c; });
  const base=(remote.lastActive||'')>(local.lastActive||'')?remote:local;
  const out=Object.assign({}, base);
  out.custom=Object.values(map);
  out.vocab=Object.assign({}, remote.vocab||{}, local.vocab||{});
  out.cards=Object.assign({}, remote.cards||{}, local.cards||{});
  out.history=Object.assign({}, remote.history||{}, local.history||{});
  out.minutes=Object.assign({}, remote.minutes||{}, local.minutes||{});
  out.oral=Object.assign({}, remote.oral||{}, local.oral||{});
  out.settings=Object.assign({}, remote.settings||{}, local.settings||{});
  out.streak=Math.max(local.streak||0, remote.streak||0);
  out.record=Math.max(local.record||0, remote.record||0);
  out.trad={answered:Math.max((local.trad||{}).answered||0,(remote.trad||{}).answered||0), sum:Math.max((local.trad||{}).sum||0,(remote.trad||{}).sum||0)};
  out.redac={done:Math.max((local.redac||{}).done||0,(remote.redac||{}).done||0)};
  return out;
}

/* série + activité */
function recordActivity(){
  const t=todayStr();
  if(!S.history[t]){
    // premier acte de la journée -> mise à jour de la série
    const y=new Date(Date.now()-DAY).toISOString().slice(0,10);
    if(S.lastActive===y) S.streak+=1;
    else if(S.lastActive!==t) S.streak=1;
    S.record=Math.max(S.record,S.streak);
  }
  S.history[t]=(S.history[t]||0)+1;
  S.lastActive=t;
  save();
}

  if(dt>0 && dt<120){ S.minutes[m]=(S.minutes[m]||0)+dt; } }, 15000);

/* ================= SRS (cartes mémo) ================= */
function ensureCard(en){ if(!S.cards[en]) S.cards[en]={box:0,due:Date.now(),seen:0,fails:0}; }
function dueCards(){
  const end=new Date(); end.setHours(23,59,59,999);
  return Object.keys(S.cards).filter(en=>S.cards[en].due<=end.getTime())
    .sort((a,b)=>S.cards[a].due-S.cards[b].due);
}
function gradeCard(en,known){
  ensureCard(en); const c=S.cards[en]; c.seen++;
  if(known){ c.box=Math.min(c.box+1,INTERVALS.length-1); }
  else { c.box=0; c.fails++; }
  c.due=Date.now()+INTERVALS[c.box]*DAY;
  save();
}

function dailyLot(){
  const theme=LESSONS[ daysSinceEpoch() % LESSONS.length ].theme;
  const lot=DATA.terms.filter(t=>t.theme===theme);
  return lot.length?lot:DATA.terms.slice(0,6);
}
/* phrases orales du jour (8 tournantes) */
function dailyPhrases(){
  const n=8, P=DATA.phrases, start=(daysSinceEpoch()*n)%P.length;
  const out=[]; for(let i=0;i<n;i++) out.push(P[(start+i)%P.length]);
  return out;
}

function allTerms(){ return DATA.terms.concat(customTerms()); }
function findTerm(en){ const k=en.toLowerCase(); return allTerms().find(t=>t.en.toLowerCase()===k)||{en:en,fr:'',theme:''}; }

function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function toast(msg){
  let el=document.getElementById('toast'); if(el) el.remove();
  el=document.createElement('div'); el.id='toast'; el.textContent=msg; document.body.appendChild(el);
  clearTimeout(toast._t); toast._t=setTimeout(()=>el.remove(),2200);
}
/* Synthèse vocale (accent britannique par défaut) */
let _voices=[];
function loadVoices(){ _voices=window.speechSynthesis?speechSynthesis.getVoices():[]; }
if(window.speechSynthesis){ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; }
function speak(text,onend){
  if(!window.speechSynthesis){ toast('Synthèse vocale indisponible sur ce navigateur'); return; }
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang=S.settings.accent||'en-GB'; u.rate=UI.rate||1;
  const v=_voices.find(v=>v.lang===u.lang)||_voices.find(v=>v.lang&&v.lang.startsWith('en'));
  if(v) u.voice=v;
  if(onend) u.onend=onend;
  speechSynthesis.speak(u);
}

function gram(){

  const i=UI.quiz.i%QZ.length, Q=QZ[i], pick=UI.quiz.pick;
  const opt=(k)=>{
    let border='#3A4166', bg='#252C4A';
    if(pick!==null){
      if(k===Q.correct){ border='#4ED8A0'; bg='rgba(78,216,160,.2)'; }
      else if(k===pick){ border='#E4573D'; bg='rgba(228,87,61,.22)'; }

    return `<div class="clk" data-act="pick" data-i="${k}" style="padding:16px 18px;border-radius:14px;border:1px solid ${border};background:${bg};font-size:16px">${esc(Q.opts[k])}</div>`;
  };

  const exColor={PAST:['#2D5EA8','#E4EDFB'],PERF:['#0F6E50','#E4F5EE']};

        <div style="background:#1B2138;border-radius:26px;padding:28px;color:#F7F7FC">

function tradBody(){

        <div style="display:flex;align-items:baseline;gap:10px"><span class="serif" style="font-size:40px">${S.redac.done}</span><span style="font-size:13px;color:#A9B0CF">sujets travaillés</span></div>
      </div>
      <div style="background:#E9E4FB;border-radius:24px;padding:22px;font-size:14.5px;line-height:1.6;color:#432BA4">Écris d'abord ta version, puis compare-la au corrigé modèle. Vise à replacer naturellement les expressions cibles dans un texte fluide, pas à recopier le modèle.</div>
    </div>
  </div>`;
}
function ecrit(){
  const tab=UI.ecritTab;
  const tb=(k,label)=>`<div class="clk" data-act="ecrittab" data-tab="${k}" style="padding:11px 24px;border-radius:999px;font-size:14px;font-weight:700;background:${tab===k?'#1B2138':'transparent'};color:${tab===k?'#F7F7FC':'#5C6280'}">${label}</div>`;
  return `<div style="padding:34px">
    <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:22px;flex-wrap:wrap;margin-bottom:24px">
      <div>
        <div class="mono" style="font-size:11px;letter-spacing:.14em;color:#5B3BD4;margin-bottom:10px">EXPRESSION ÉCRITE · CORRECTION PAR RÉPONSE-MODÈLE</div>
        <h1 class="serif" style="font-size:44px;line-height:1.05;margin:0;font-weight:400">Écris <span style="font-style:italic">en anglais</span></h1>
      </div>
      <div style="display:flex;gap:6px;background:#EDEDF6;padding:5px;border-radius:999px">${tb('trad','Traduction')}${tb('redac','Rédaction')}</div>
    </div>
    ${tab==='trad'?tradBody():redacBody()}
  </div>`;
}

/* ================= MOUNT + RENDER ================= */
const VIEWS={dash,lesson,gram,vocab,cards,oral,ecrit,settings};
function render(){
  const app=document.getElementById('app');
  app.innerHTML=`<div style="padding:30px 30px 46px;min-height:100vh">
    <div style="max-width:1280px;margin:0 auto;background:#F7F7FC;border-radius:30px;box-shadow:0 30px 60px -40px rgba(27,33,56,.35);overflow:hidden">
      ${nav()}
      ${(VIEWS[UI.view]||dash)()}
    </div>
    <div style="max-width:1280px;margin:14px auto 0;text-align:center;font-size:12px;color:#9A7B63">FluentPO · progression sauvegardée sur cet appareil · vocabulaire tiré de l'ebook « L'anglais du Product Owner »</div>
  </div>`;
}

/* ================= AUDIO (lecture TTS de la leçon) ================= */
function stopAudio(){ if(window.speechSynthesis) speechSynthesis.cancel(); UI.audioPlaying=false; }

/* ================= MICRO / RECONNAISSANCE VOCALE ================= */
let mediaRec=null, mediaChunks=[], sr=null;
function normalize(s){ return s.toLowerCase().replace(/[^a-z0-9' ]/g,' ').split(/\s+/).filter(Boolean); }
/* diff mot à mot entre une réponse et une référence */
function tok(t){ return t.toLowerCase().replace(/[^a-z0-9']/g,''); } // hyphens/punctuation retirés
function diffWords(reference, answer){
  const refTokens=reference.split(/\s+/).filter(Boolean);
  const ansBag={}; answer.split(/\s+/).forEach(t=>{ const w=tok(t); if(w) ansBag[w]=(ansBag[w]||0)+1; });
  let matched=0, refCount=0; const missing=[];
  const html=refTokens.map(t=>{
    const w=tok(t);
    if(!w) return `<span style="color:#5C6280">${esc(t)}</span>`;        // ponctuation
    refCount++;
    if(ansBag[w]>0){ ansBag[w]--; matched++; return `<span style="color:#0F6E50">${esc(t)}</span>`; }
    missing.push(w);
    return `<span style="color:#B4462C;text-decoration:underline;text-decoration-style:wavy">${esc(t)}</span>`;
  }).join(' ');
  const extra=Object.keys(ansBag).filter(w=>ansBag[w]>0);
  const score=refCount?Math.round(matched/refCount*100):0;
  return {html, score, missing, extra};
}
function scoreMatch(target,said){
  const a=normalize(target), b=normalize(said); if(!a.length) return 0;
  const bag={}; b.forEach(w=>bag[w]=(bag[w]||0)+1); let hit=0;
  a.forEach(w=>{ if(bag[w]>0){ hit++; bag[w]--; } });
  return Math.round(hit/a.length*100);
}
function startRecognition(target,idx){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(SR){
    sr=new SR(); sr.lang=S.settings.accent||'en-GB'; sr.interimResults=false; sr.maxAlternatives=1;
    UI.rec={state:'recording',transcript:'',score:null,url:UI.rec.url};
    render();
    sr.onresult=(e)=>{ const said=e.results[0][0].transcript; const sc=scoreMatch(target,said);
      UI.rec={state:'done',transcript:said,score:sc,url:UI.rec.url};
      S.oral[idx]=Math.max(S.oral[idx]||0,sc); S.program.oral=true; recordActivity(); render();
    };
    sr.onerror=(e)=>{ UI.rec={state:'idle',transcript:'',score:null,url:UI.rec.url}; toast(e.error==='not-allowed'?'Micro refusé':'Reconnaissance interrompue'); render(); };
    sr.onend=()=>{ if(UI.rec.state==='recording'){ UI.rec.state='idle'; render(); } };
    try{ sr.start(); }catch(e){ recordFallback(target,idx); }
  } else {
    recordFallback(target,idx);
  }
}
function recordFallback(target,idx){
  // pas de reconnaissance vocale -> on enregistre l'audio pour réécoute
  navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
    mediaRec=new MediaRecorder(stream); mediaChunks=[];
    mediaRec.ondataavailable=e=>mediaChunks.push(e.data);
    mediaRec.onstop=()=>{ const blob=new Blob(mediaChunks,{type:'audio/webm'}); const url=URL.createObjectURL(blob);
      UI.rec={state:'done',transcript:'',score:null,url:url}; S.program.oral=true; recordActivity();
      stream.getTracks().forEach(t=>t.stop()); render(); toast('Enregistré — réécoute-toi et compare'); };
    UI.rec={state:'recording',transcript:'',score:null,url:null}; render();
    mediaRec.start();
    setTimeout(()=>{ if(mediaRec&&mediaRec.state==='recording') mediaRec.stop(); },5000);
  }).catch(()=>{ toast('Micro indisponible ou refusé'); UI.rec={state:'idle',transcript:'',score:null,url:null}; render(); });
}
function stopRec(){ if(sr){ try{sr.stop();}catch(e){} } if(mediaRec&&mediaRec.state==='recording'){ mediaRec.stop(); } }

/* ================= DELEGATION D'ÉVÉNEMENTS ================= */
document.addEventListener('click',(e)=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const act=el.dataset.act;
  switch(act){
    case 'view': stopAudio(); UI.view=el.dataset.view; if(UI.view!=='cards')UI.flipped=false; render(); break;
    case 'start': { stopAudio(); const P=S.program; UI.view=!P.lesson?'lesson':!P.gram?'gram':!P.vocab?'vocab':!P.oral?'oral':!P.ecrit?'ecrit':'cards'; render(); break; }
    case 'speak': speak(el.dataset.text); break;
    case 'ltab': UI.tab=el.dataset.tab; stopAudio(); render(); break;
    case 'rate': UI.rate=parseFloat(el.dataset.rate); render(); break;
    case 'aplay':
      if(UI.audioPlaying){ stopAudio(); } else { UI.audioPlaying=true; speak(el.dataset.text,()=>{UI.audioPlaying=false;render();}); }
      render(); break;
    case 'addword': { const en=el.dataset.en; ensureCard(en.toLowerCase()); S.vocab[en.toLowerCase()]=S.vocab[en.toLowerCase()]||{mastered:false,seen:0}; recordActivity(); toast('Ajouté aux cartes mémo'); render(); break; }
    case 'lessondone': S.program.lesson=true; recordActivity(); toast('Leçon validée'); render(); break;
    case 'pick': {
      if(UI.quiz.pick!==null) break;
      const k=parseInt(el.dataset.i,10); UI.quiz.pick=k; const QZ=curQuiz(); const Q=QZ[UI.quiz.i%QZ.length];
      S.quiz.answered++; if(k===Q.correct) S.quiz.correct++; else { ensureCard(('grammaire: '+Q.q).toLowerCase()); }
      S.program.gram=true; recordActivity(); render(); break;
    }
    case 'qnext': UI.quiz.i=(UI.quiz.i+1)%curQuiz().length; UI.quiz.pick=null; render(); break;
    case 'qskip': UI.quiz.i=(UI.quiz.i+1)%curQuiz().length; UI.quiz.pick=null; render(); break;
    case 'vtheme': VOCAB_THEME=el.dataset.theme; render(); break;
    case 'addcustom': {
      const enI=document.getElementById('cv_en'), frI=document.getElementById('cv_fr');
      const en=(enI&&enI.value||'').trim(), fr=(frI&&frI.value||'').trim();
      if(!en||!fr){ toast('Remplis l\'anglais et le français'); break; }
      const k=en.toLowerCase();
      if((S.custom||[]).some(c=>c.en.toLowerCase()===k) || DATA.terms.some(t=>t.en.toLowerCase()===k)){ toast('Ce mot est déjà dans tes cartes'); break; }
      S.custom.push({en:en,fr:fr,ts:Date.now()});
      S.vocab[k]={mastered:false,seen:0}; ensureCard(k); S.cards[k].due=Date.now();
      VOCAB_THEME='Mes ajouts'; recordActivity(); toast('« '+en+' » ajouté à tes cartes'); render(); break;
    }
    case 'delcustom': {
      const en=el.dataset.en, k=en.toLowerCase();
      if(!confirm('Supprimer « '+en+' » de ton vocabulaire et de tes cartes ?')) break;
      S.custom=(S.custom||[]).filter(c=>c.en.toLowerCase()!==k);
      delete S.vocab[k]; delete S.cards[k]; save(); render(); break;
    }
    case 'vmaster': { const en=el.dataset.en, k=en.toLowerCase(); const st=S.vocab[k]||{mastered:false,seen:0};
      st.mastered=!st.mastered; st.seen=(st.seen||0)+1; S.vocab[k]=st; ensureCard(k);
      if(st.mastered){ const c=S.cards[k]; c.box=Math.min(c.box+1,INTERVALS.length-1); c.due=Date.now()+INTERVALS[c.box]*DAY; }
      S.program.vocab=true; recordActivity(); render(); break; }
    case 'vreview': { const en=el.dataset.en, k=en.toLowerCase(); S.vocab[k]=S.vocab[k]||{mastered:false,seen:0}; S.vocab[k].mastered=false;
      ensureCard(k); const c=S.cards[k]; c.box=0; c.due=Date.now(); S.program.vocab=true; recordActivity(); toast('Ajouté aux révisions'); render(); break; }
    case 'flip': UI.flipped=!UI.flipped; render(); break;
    case 'grade': { const due=dueCards(); if(!due.length)break; const en=due[UI.cardIdx%due.length];
      gradeCard(en, el.dataset.known==='1'); recordActivity(); UI.flipped=false; UI.cardIdx=0; render(); break; }
    case 'rec':
      if(UI.rec.state==='recording'){ stopRec(); }
      else { UI.rec={state:'idle',transcript:'',score:null,url:null}; startRecognition(el.dataset.text, parseInt(el.dataset.idx,10)); }
      break;
    case 'oretry': UI.rec={state:'idle',transcript:'',score:null,url:null}; render(); break;
    case 'onext': UI.oralIdx++; UI.rec={state:'idle',transcript:'',score:null,url:null}; render(); break;
    case 'ecrittab': UI.ecritTab=el.dataset.tab; render(); break;
    case 'traddir': UI.tradDir=UI.tradDir==='fr2en'?'en2fr':'fr2en'; UI.tradChecked=false; UI.tradAnswer=''; render(); break;
    case 'tradcheck': {
      const ta=document.getElementById('trad_answer'); const val=(ta&&ta.value||'').trim();
      if(!val){ toast('Écris ta traduction d\'abord'); break; }
      UI.tradAnswer=val; UI.tradChecked=true;
      const P=DATA.phrases; const pair=P[UI.tradIdx%P.length];
      const reference=UI.tradDir==='fr2en'?pair.en:pair.fr;
      const d=diffWords(reference,val); S.trad.answered++; S.trad.sum+=d.score;
      S.program.ecrit=true; recordActivity(); render(); break;
    }
    case 'tradnext': UI.tradIdx++; UI.tradChecked=false; UI.tradAnswer=''; render(); break;
    case 'redaccheck': {
      const ta=document.getElementById('redac_answer'); const val=(ta&&ta.value||'').trim();
      if(!val){ toast('Rédige ta réponse d\'abord'); break; }
      UI.redacAnswer=val; UI.redacChecked=true; S.redac.done++; S.program.ecrit=true; recordActivity(); render(); break;
    }
    case 'redacnext': UI.redacIdx++; UI.redacChecked=false; UI.redacAnswer=''; render(); break;
    case 'toggle': { const k=el.dataset.key; S.settings[k]=!S.settings[k]; save(); render(); break; }
    case 'cycle': { const k=el.dataset.key;
      if(k==='accent'){ S.settings.accent=S.settings.accent==='en-GB'?'en-US':'en-GB'; }
      else if(k==='priority'){ const arr=['Basse','Moyenne','Élevée']; S.settings.priority=arr[(arr.indexOf(S.settings.priority)+1)%arr.length]; }
      save(); render(); break; }
    case 'editgoal': { const g=el.dataset.goal; const cur=S.settings[g]; const v=prompt('Progression '+g.toUpperCase()+' (%)',cur);
      if(v!==null){ const n=Math.max(0,Math.min(100,parseInt(v,10)||0)); S.settings[g]=n; save(); render(); } break; }
    case 'signin':
    case 'signup': {
      const ie=document.getElementById('sync_email'), ip=document.getElementById('sync_pass');
      const email=(ie&&ie.value||'').trim(), pass=(ip&&ip.value||'');
      if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ toast('Entre un e-mail valide'); break; }
      if(pass.length<6){ toast('Mot de passe : 6 caractères minimum'); break; }
      if(!SB){ toast('Synchro indisponible'); break; }
      el.textContent='…';
      const req = act==='signup' ? SB.auth.signUp({ email, password:pass }) : SB.auth.signInWithPassword({ email, password:pass });
      req.then(({data,error})=>{
        if(error){
          const m=error.message||'';
          if(/already registered/i.test(m)) toast('Compte déjà créé : clique « Se connecter ».');
          else if(/invalid login/i.test(m)) toast('Identifiants incorrects, ou crée l\'accès d\'abord.');
          else toast('Erreur : '+m);
          render();
        } else if(act==='signup' && !data.session){
          toast('Compte créé. Désactive « Confirm email » dans Supabase, puis « Se connecter ».'); render();
        } else {
          toast(act==='signup'?'Accès créé, connecté ✓':'Connecté ✓'); /* onAuthStateChange gère la synchro + rendu */
        }
      }).catch(()=>{ toast('Erreur réseau'); render(); });
      break;
    }
    case 'signout': { if(SB){ SB.auth.signOut().then(()=>{ SESSION=null; toast('Déconnecté'); render(); }); } break; }
    case 'assess': toast('Point de niveau noté — continue ta série !'); break;
    case 'export': exportCSV(); break;
    case 'reset': if(confirm('Effacer toute ta progression FluentPO sur cet appareil ?')){ localStorage.removeItem(KEY); S=load(); UI.view='dash'; toast('Progression réinitialisée'); render(); } break;
  }
});
document.addEventListener('change',(e)=>{
  const el=e.target.closest('[data-field]'); if(!el) return;
  S.settings[el.dataset.field]=el.value; save(); toast('Rappel réglé à '+el.value);
});

/* ================= EXPORT CSV ================= */
function exportCSV(){
  const rows=[['type','en','fr','maitrise','boite','vu','echecs']];
  allTerms().forEach(t=>{ const k=t.en.toLowerCase(); const v=S.vocab[k]||{}; const c=S.cards[k]||{};
    rows.push([t.custom?'perso':'vocab',t.en,t.fr,v.mastered?'oui':'non',c.box??'',c.seen??'',c.fails??'']); });
  rows.push(['quiz','present perfect vs past simple','', S.quiz.correct+'/'+S.quiz.answered,'','','']);
  const csv=rows.map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='fluentpo-progression.csv'; a.click();
  toast('Export CSV téléchargé');
}

/* ---- init synchro cloud ---- */
try{
  if(window.supabase && SUPA_URL){
    SB=window.supabase.createClient(SUPA_URL, SUPA_ANON, { auth:{ persistSession:true, detectSessionInUrl:true, autoRefreshToken:true } });
    SB.auth.onAuthStateChange(async (event, session)=>{
      SESSION=session;
      if(session){
        const remote=await cloudPull();
        if(remote){ S=mergeState(S, remote); try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
        await cloudPush();
        if(location.hash.indexOf('access_token')>=0){ history.replaceState(null,'',location.pathname+location.search); }
      }
      render();
    });
  }
}catch(e){ /* pas de synchro, l'app reste locale */ }

/* go */
render();
</script>
